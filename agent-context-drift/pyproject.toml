[project]
name = "agent-context-drift"
version = "0.1.0"
description = "Lint AI-agent instruction files (CLAUDE.md, AGENTS.md, .cursorrules) against the actual repository tree"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Daria Voronkina" }]
keywords = ["ai", "agents", "claude", "documentation", "linter", "llm", "devtools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Voronik1801/agent-context-drift"
Issues = "https://github.com/Voronik1801/agent-context-drift/issues"

[project.scripts]
agent-drift = "agent_drift:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent_drift"]
