name: harness-guide

on:
  push:
    paths: ["harness-guide/**", ".github/workflows/harness-guide.yml"]
  pull_request:
    paths: ["harness-guide/**"]

defaults:
  run:
    working-directory: harness-guide

jobs:
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell templates parse
        run: |
          bash -n templates/deploy.sh
          bash -n templates/claude-hooks/guard-main.sh
          sh -n templates/git-hooks/commit-msg
          sh -n templates/git-hooks/pre-push
      - name: Settings template is valid JSON
        run: python3 -m json.tool templates/claude-settings.json > /dev/null
      - name: Agent hook scenarios
        run: bash tests/test_guard.sh
      - name: Git hook scenarios
        run: bash tests/test_git_hooks.sh
      - name: Deploy script scenarios
        run: bash tests/test_deploy.sh
